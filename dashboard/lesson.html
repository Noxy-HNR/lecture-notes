<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson · Lecture Notes</title>
<link rel="stylesheet" href="/style.css">
<script src="/stop.js" defer></script>
<style>
html,body{height:100%}
body{display:flex;flex-direction:column}
.player{flex:1;display:flex;flex-direction:column;min-height:0;max-width:1400px;width:100%;margin:0 auto;padding:18px 24px 0}
.lesson-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px}
.lesson-head h1{font-size:15px;font-weight:600;margin:0;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-head a{font-size:13px;color:var(--text-dim);text-decoration:none;white-space:nowrap}
.lesson-head a:hover{color:var(--accent)}
.stage{flex:1;min-height:0;position:relative;border:1px solid var(--border);border-radius:16px;background:var(--bg-raised);overflow:hidden;box-shadow:var(--shadow)}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);grid-template-rows:minmax(0,1fr);gap:34px;padding:42px 48px;overflow:auto;animation:enter .35s ease}
.slide.text-only{grid-template-columns:minmax(0,820px);justify-content:center}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide-text{display:flex;flex-direction:column;gap:16px;min-width:0;align-self:center;max-height:100%;overflow:auto}
.kind{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.slide h2{font-size:clamp(24px,3vw,38px);line-height:1.15;margin:0;letter-spacing:-.01em}
.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.bullets li{position:relative;padding-left:24px;font-size:clamp(16px,1.45vw,20px);line-height:1.45}
.bullets li::before{content:"";position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{font-size:13px;padding:8px 11px;border-radius:9px;background:var(--bg-inset);border:1px solid var(--border);max-width:100%}
.term b{color:var(--accent);font-weight:650}
.heads-up{border:1px solid var(--warn);border-left-width:4px;border-radius:9px;padding:11px 14px;font-size:14px;background:color-mix(in srgb,var(--warn) 8%,transparent)}
.heads-up b{color:var(--warn)}
.question{font-size:clamp(20px,2.2vw,28px);line-height:1.35;font-weight:600}
.answer{font-size:17px;line-height:1.5;padding:14px 16px;border-radius:10px;background:var(--accent-dim);border:1px solid var(--accent)}
.visual{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;min-height:0;height:100%}
/* The frame takes the slide's full height, and pictures and diagrams scale down to fit it -
   a tall flowchart used to overflow and get its first and last steps clipped. */
.visual .frame{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--bg-inset);border:1px solid var(--border);padding:14px;overflow:hidden}
.visual .frame.light{background:#fff}
.visual img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.visual svg{width:100%;height:100%}
.visual figcaption{font-size:13px;color:var(--text-dim);text-align:center}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:56px clamp(24px,7vw,110px);animation:enter .35s ease;overflow:auto}
.cover h2{font-size:clamp(30px,4.2vw,54px);line-height:1.08;margin:0;letter-spacing:-.02em}
.cover p{font-size:clamp(16px,1.6vw,21px);line-height:1.55;color:var(--text-dim);max-width:900px;margin:0}
.cover .start{align-self:flex-start;font-size:16px;padding:12px 20px}
.cover-quiz{align-self:flex-start;display:flex;flex-wrap:wrap;gap:10px}
.cover-quiz:empty{display:none}
.cover-quiz .btn{font-size:14px}
/* Quiz mode takes over the stage; the player's own controls would only get in its way. */
.player.quizzing .controls,.player.quizzing .captions{display:none}
.quiz{position:absolute;inset:0;overflow:auto;padding:36px clamp(18px,5vw,48px);animation:enter .35s ease}
.quiz-card{max-width:760px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px}
.quiz-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.quiz-leave{font:inherit;font-size:13px;color:var(--text-dim);background:none;border:0;min-height:44px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center}
.quiz-leave:hover{color:var(--accent)}
.quiz-ctx{font-size:13px;color:var(--text-dim)}
.quiz-bar{height:6px;border-radius:3px;background:var(--bg-inset);border:1px solid var(--border);overflow:hidden}
.quiz-bar span{display:block;height:100%;background:var(--accent)}
.quiz-card .chip{align-self:flex-start}
.quiz label{font-size:13px;color:var(--text-dim)}
.quiz textarea{width:100%;display:block;margin-top:6px;font:inherit;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg-inset);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:84px;resize:vertical}
.quiz .answer{overflow-wrap:anywhere}
.yours{padding:10px 14px;border-radius:10px;border:1px dashed var(--border-strong);color:var(--text-dim);white-space:pre-wrap;overflow-wrap:anywhere}
.yours b{display:block;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.quiz-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
#revealed{display:flex;flex-direction:column;gap:12px}
#revealed .quiz-actions{margin-top:6px}
.quiz-actions .btn{min-height:44px;padding:8px 18px;font-size:15px}
.hint,.quiz-note{margin:0;font-size:13px;color:var(--text-faint)}
.quiz-note{color:var(--text-dim)}
kbd{margin-left:8px;padding:1px 6px;border-radius:5px;border:1px solid var(--border-strong);font:11px var(--mono);opacity:.8}
.score{font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.missed-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
.missed-list .question{font-size:18px;margin-bottom:8px}
.quiet{margin:auto;color:var(--text-dim);padding:40px;text-align:center;max-width:520px}
.captions{border-top:1px solid var(--border);padding:12px 24px;font-size:15px;line-height:1.55;color:var(--text-dim);max-height:22vh;overflow:auto}
.controls{display:flex;align-items:center;gap:10px;padding:14px 0 18px;flex-wrap:wrap}
.icon{font:inherit;font-size:14px;min-width:40px;height:38px;padding:0 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-raised);color:var(--text);cursor:pointer}
.icon:hover:not(:disabled){border-color:var(--accent)}
.icon.primary{background:var(--accent);color:#06231c;border-color:var(--accent);font-weight:650;min-width:92px}
.icon[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.track{flex:1;min-width:160px;display:flex;gap:3px;height:10px;cursor:pointer}
.track div{flex:1;border-radius:3px;background:var(--bg-inset);border:1px solid var(--border);position:relative;overflow:hidden}
.track div.done{background:color-mix(in srgb,var(--accent) 45%,var(--bg-inset))}
/* A long lesson (89 slides): the borders and gaps alone are wider than a phone, so draw the outline inside the segment. */
.track.dense{gap:1px}
.track.dense div{border:0;outline:1px solid var(--border);outline-offset:-1px;border-radius:2px}
.track.dense div.current{outline-color:var(--accent)}
.track div.current{border-color:var(--accent)}
.track div span{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent)}
.time{font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:92px;text-align:right}
select{font:inherit;font-size:13px;color:var(--text);background:var(--bg-raised);border:1px solid var(--border);border-radius:9px;height:38px;padding:0 8px}
.error{margin:auto;color:var(--bad);padding:40px;text-align:center}
button:disabled{opacity:.45;cursor:not-allowed}[hidden]{display:none!important}
.player:fullscreen{max-width:none;padding:18px 28px 0;background:var(--bg)}
@media(max-width:900px){
  .slide{grid-template-columns:1fr;grid-template-rows:auto minmax(260px,50vh);padding:24px 20px;gap:20px}
  .slide-text{align-self:start}
  .player{padding:12px 12px 0}
  .time{display:none}
}
@media(hover:none){.hint,kbd{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span>Lecture Notes</div>
  <nav class="tabs" aria-label="Lecture tools">
    <a href="/">Notes</a>
    <a href="/corrections">Corrections</a>
    <a href="/lessons" class="active" aria-current="page">Lessons</a>
    <a href="/diagnostics">Diagnostics</a>
  </nav>
</header>

<main class="player" id="player">
  <div class="lesson-head">
    <h1 id="lesson-name">Loading lesson…</h1>
    <a href="/lessons">← All lessons</a>
  </div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="captions" id="captions" hidden></div>
  <div class="controls">
    <button class="icon" id="prev" aria-label="Previous slide" title="Previous (←)">‹</button>
    <button class="icon primary" id="play" title="Play / pause (space)">▶ Play</button>
    <button class="icon" id="next" aria-label="Next slide" title="Next (→)">›</button>
    <div class="track" id="track" role="group" aria-label="Slides"></div>
    <span class="time" id="time"></span>
    <select id="speed" aria-label="Narration speed" title="Narration speed">
      <option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="2">2×</option><option value="2.5">2.5×</option><option value="3">3×</option>
    </select>
    <button class="icon" id="auto" aria-pressed="true" title="Advance automatically (a)">Auto</button>
    <button class="icon" id="cc" aria-pressed="false" title="Show narration text (c)">CC</button>
    <button class="icon" id="quiz-btn" title="Quiz yourself on this lesson's questions (q)" hidden>Quiz</button>
    <button class="icon" id="full" aria-label="Fullscreen" title="Fullscreen (f)">⤢</button>
  </div>
  <audio id="audio" preload="auto"></audio>
</main>

<script src="/vendor/mermaid.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const rate = () => Number($('speed').value) || 1;
// Lengths and positions are shown as they play at the chosen speed: 30 minutes at 2x reads 15:00.
const startLabel = () => '▶ Start lesson' + (lesson.duration_seconds ? ' · ' + clock(lesson.duration_seconds / rate()) : '');
const params = new URLSearchParams(location.search);
const lessonId = params.get('id');
const audio = $('audio');
const KIND = {overview: "What you'll learn", concept: 'Concept', example: 'Worked example', recap: 'Recap', check: 'Quick check'};
const reviewMode = params.get('review') === '1';       // /lesson?review=1: missed questions from every lesson
let lesson = null, index = 0, playing = false, advanceTimer = null, renderToken = 0;
let quiz = null, quizState = null, quizStarting = false;   // the quiz on screen; what the dashboard saved for this lesson
let quizOld = false;                                       // the dashboard predates quiz mode, so nothing can be saved

function store(key, value) { try { localStorage.setItem(key, value); } catch {} }
function recall(key) { try { return localStorage.getItem(key); } catch { return null; } }

const dark = matchMedia('(prefers-color-scheme: dark)').matches;
if (window.mermaid) mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'default',
  fontFamily: getComputedStyle(document.body).fontFamily, flowchart: { htmlLabels: false } });

const asset = file => `/lesson-assets?id=${encodeURIComponent(lessonId)}&file=${encodeURIComponent(file)}`;
const slides = () => lesson.slides;
const total = () => slides().length + 1;               // slide 0 is the title card
const slideAt = i => i === 0 ? null : slides()[i - 1];

function coverHtml() {
  const range = lesson.dates.length > 1 ? `${lesson.dates.length} lectures` : '1 lecture';
  return `<div class="cover">
    <div class="kind">${lesson.kind === 'freestyle' ? 'Freestyle lesson' : `${esc(lesson.class_code)} · ${esc(lesson.class_title)} · ${range}`}</div>
    <h2>${esc(lesson.title)}</h2>
    ${lesson.kind === 'freestyle' && lesson.topic ? `<p class="kind" style="text-transform:none;letter-spacing:0;font-weight:500">Topic: ${esc(lesson.topic)}</p>` : ''}
    ${lesson.focus ? `<p class="kind" style="text-transform:none;letter-spacing:0;font-weight:500">Focus: ${esc(lesson.focus)}</p>` : ''}
    <p>${esc(lesson.tldr)}</p>
    <button class="btn primary start" id="start-lesson">${startLabel()}</button>
    <div class="cover-quiz" id="cover-quiz"></div>
    ${lesson.warnings?.length ? `<p style="font-size:13px">${esc(lesson.warnings.join(' · '))}</p>` : ''}
  </div>`;
}

function slideHtml(slide, number) {
  const visual = slide.visual || { type: 'none' };
  const hasVisual = visual.type !== 'none';
  const text = `<div class="slide-text">
    <div class="kind">${esc(KIND[slide.kind] || 'Concept')} · ${number} of ${slides().length}</div>
    <h2>${esc(slide.title)}</h2>
    ${slide.kind === 'check'
      ? `<div class="question">${esc(slide.question)}</div>
         <button class="btn" id="reveal" style="align-self:flex-start">Reveal answer</button>
         <div class="answer" id="answer" hidden>${esc(slide.answer)}</div>`
      : (slide.bullets.length ? `<ul class="bullets">${slide.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : '')}
    ${slide.key_terms?.length ? `<div class="terms">${slide.key_terms.map(t => `<div class="term"><b>${esc(t.term)}</b> — ${esc(t.meaning)}</div>`).join('')}</div>` : ''}
    ${slide.heads_up ? `<div class="heads-up"><b>Heads up:</b> ${esc(slide.heads_up)}</div>` : ''}
  </div>`;
  let figure = '';
  if (visual.type === 'image' || visual.type === 'molecule') {
    figure = `<figure class="visual"><div class="frame light">
      <img src="${asset(visual.file)}" alt="${esc(visual.caption || slide.title)}"></div>
      ${visual.caption ? `<figcaption>${esc(visual.caption)}</figcaption>` : ''}</figure>`;
  } else if (visual.type === 'diagram') {
    figure = `<figure class="visual"><div class="frame" id="diagram"></div>
      ${visual.caption ? `<figcaption>${esc(visual.caption)}</figcaption>` : ''}</figure>`;
  }
  return `<div class="slide ${hasVisual ? '' : 'text-only'}" id="slide">${text}${figure}</div>`;
}

async function render() {
  const token = ++renderToken;
  const slide = slideAt(index);
  $('stage').innerHTML = slide ? slideHtml(slide, index) : coverHtml();
  if (!slide) { $('start-lesson').onclick = () => { go(1); setPlaying(true); }; drawCoverQuiz(); }
  if (slide?.kind === 'check') $('reveal').onclick = () => { $('answer').hidden = false; $('reveal').hidden = true; };
  if (slide?.visual?.type === 'diagram') {
    try {
      if (!window.mermaid) throw new Error('diagram renderer missing');
      const { svg } = await mermaid.render(`diagram-${index}-${token}`, slide.visual.mermaid);
      if (token === renderToken) $('diagram').innerHTML = svg;
    } catch {
      if (token !== renderToken) return;
      const figure = $('slide').querySelector('.visual');       // a diagram that won't render is left out
      if (figure) figure.remove();
      $('slide').classList.add('text-only');
      document.querySelectorAll('[id^="ddiagram-"]').forEach(n => n.remove());
    }
  }
  if (slide?.visual && slide.visual.type !== 'diagram' && slide.visual.type !== 'none') {
    const img = $('stage').querySelector('img');
    if (img) img.onerror = () => { img.closest('.visual').remove(); $('slide').classList.add('text-only'); };
  }
  $('captions').textContent = slide ? slide.narration : lesson.tldr;
  $('prev').disabled = index === 0; $('next').disabled = index === total() - 1;
  drawTrack(); updateTime();
}

function drawTrack() {
  $('track').classList.toggle('dense', slides().length > 40);
  $('track').innerHTML = slides().map((s, i) =>
    `<div class="${i + 1 < index ? 'done' : ''} ${i + 1 === index ? 'current' : ''}" data-i="${i + 1}" title="${esc(s.title)}"
      style="flex:${Math.max(4, s.audio_seconds || 20)}"><span id="fill-${i + 1}"></span></div>`).join('');
}

function updateTime() {
  const before = slides().slice(0, Math.max(0, index - 1)).reduce((sum, s) => sum + (s.audio_seconds || 0), 0);
  const here = index > 0 && !audio.paused || (index > 0 && audio.currentTime) ? audio.currentTime : 0;
  $('time').textContent = lesson.duration_seconds ? `${clock((before + here) / rate())} / ${clock(lesson.duration_seconds / rate())}` : '';
  const fill = $('fill-' + index), dur = slideAt(index)?.audio_seconds;
  if (fill && dur) fill.style.width = Math.min(100, audio.currentTime / dur * 100) + '%';
}

function go(i) {
  if (quiz) return;                  // a timer or key from the player must not redraw the stage under a quiz
  clearTimeout(advanceTimer);
  index = Math.max(0, Math.min(total() - 1, i));
  const slide = slideAt(index);
  audio.pause();
  if (slide?.audio) { audio.src = asset(slide.audio); audio.playbackRate = Number($('speed').value); }
  else audio.removeAttribute('src');
  render();
  if (playing) startAudio();
}

function startAudio() {
  const slide = slideAt(index);
  if (!slide) { go(1); return; }
  if (!slide.audio) { scheduleAdvance(Math.max(6000, slide.narration.split(/\s+/).length * 330)); return; }
  audio.playbackRate = Number($('speed').value);
  audio.play().catch(() => setPlaying(false));
}

function scheduleAdvance(ms) {
  clearTimeout(advanceTimer);
  if ($('auto').getAttribute('aria-pressed') !== 'true') return;
  advanceTimer = setTimeout(() => { if (playing && index < total() - 1) go(index + 1); else setPlaying(false); }, ms);
}

function setPlaying(on) {
  playing = on;
  $('play').textContent = on ? '❚❚ Pause' : '▶ Play';
  if (on) startAudio(); else { audio.pause(); clearTimeout(advanceTimer); }
}

audio.addEventListener('timeupdate', updateTime);
audio.addEventListener('ended', () => {
  if (quiz) return;
  const slide = slideAt(index);
  if (slide?.kind === 'check') scheduleAdvance(5000);  // a moment to think before moving on
  else if (index < total() - 1) scheduleAdvance(700);
  else setPlaying(false);
});

$('play').onclick = () => setPlaying(!playing);
$('prev').onclick = () => go(index - 1);
$('next').onclick = () => go(index + 1);
$('track').onclick = e => { const i = e.target.closest('[data-i]')?.dataset.i; if (i) go(Number(i)); };
$('speed').onchange = () => {
  audio.playbackRate = Number($('speed').value); store('lessonSpeed', $('speed').value);
  updateTime();
  const start = $('start-lesson'); if (start) start.textContent = startLabel();
};
$('auto').onclick = () => { const on = $('auto').getAttribute('aria-pressed') !== 'true'; $('auto').setAttribute('aria-pressed', on); store('lessonAuto', on); };
$('cc').onclick = () => { const on = $('cc').getAttribute('aria-pressed') !== 'true'; $('cc').setAttribute('aria-pressed', on); $('captions').hidden = !on; store('lessonCaptions', on); };
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('player').requestFullscreen?.();
$('quiz-btn').onclick = () => startLessonQuiz(false);
document.addEventListener('keydown', e => {
  if (quiz && !e.metaKey && !e.ctrlKey && !e.altKey) { quizKey(e); return; }
  if (e.target.closest('select, input, textarea') || e.metaKey || e.ctrlKey || e.altKey || !lesson) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(index + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(index - 1); }
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'c') $('cc').click();
  else if (e.key === 'a') $('auto').click();
  else if (e.key === 'f') $('full').click();
  else if (e.key === 'q' && !$('quiz-btn').hidden) $('quiz-btn').click();
});

// ---------- quiz mode ----------
// Self-graded: the student types an answer if they like, reveals the real one, and marks it Got it or
// Missed it. Each mark is saved through /api/quiz/answer so a missed question can come back in the review
// queue. A dashboard that predates quiz mode answers those URLs with a plain-text 404; the quiz still runs
// then, it just can't remember anything.
const MAX_TYPED = 2000;
const real = text => typeof text === 'string' && text.trim() !== '';     // the same test the server applies
const checkItems = () => slides().flatMap((s, i) => s.kind === 'check' && real(s.question) && real(s.answer)
  ? [{ lesson_id: lessonId, slide: i + 1, question: s.question, answer: s.answer }] : []);

// A dashboard that predates quiz mode answers these URLs with a 404. Any other failure is a passing
// hiccup: the quiz keeps trying to save, and a save that fails says so.
const OLD_DASHBOARD = 'old';
async function quizApi(url) {
  try {
    const response = await fetch(url);
    if (response.status === 404) return OLD_DASHBOARD;
    return response.ok ? await response.json() : null;
  } catch { return null; }
}
// keepalive: a save still in flight when the page is left (Back to lessons) still reaches the server.
const post = (url, body) => fetch(url, { method: 'POST', body: JSON.stringify(body), keepalive: true,
  headers: { 'Content-Type': 'application/json', 'X-Notes-Dashboard': '1' } });

async function loadQuizState() {
  const state = await quizApi('/api/quiz?lesson=' + encodeURIComponent(lessonId || ''));
  quizOld = state === OLD_DASHBOARD;
  quizState = quizOld ? null : state;
  drawCoverQuiz();
}

function drawCoverQuiz() {
  const box = $('cover-quiz');
  if (!box || !lesson) return;
  const count = checkItems().length, due = quizState?.awaiting_review || 0;
  box.innerHTML = count ? `<button class="btn" id="quiz-me">Quiz me · ${count} question${count === 1 ? '' : 's'}</button>`
    + (due ? `<button class="btn" id="quiz-due">Review ${due} missed</button>` : '') : '';
  if (count) $('quiz-me').onclick = () => startLessonQuiz(false);
  if (due) $('quiz-due').onclick = () => startLessonQuiz(true);
}

async function startLessonQuiz(onlyMissed) {
  if (quiz || quizStarting || !lesson) return;
  quizStarting = true;
  try {
    await loadQuizState();                            // fresh counts, and whether results can be saved at all
    const due = new Set((quizState?.questions || []).filter(q => q.awaiting_review).map(q => q.slide));
    const all = checkItems().map(item => ({ ...item, missedBefore: due.has(item.slide) }));
    const missed = all.filter(item => item.missedBefore);
    beginQuiz(onlyMissed && missed.length ? missed : all, { canSave: !quizOld });
  } finally { quizStarting = false; }
}

async function startReview() {
  $('player').classList.add('quizzing');
  $('lesson-name').textContent = 'Questions to review';
  document.title = 'Review · Lessons';
  const queue = await quizApi('/api/quiz/review');
  const back = ' <a href="/lessons">Back to lessons</a>';
  if (queue === OLD_DASHBOARD) $('stage').innerHTML = `<div class="quiet">Restart the dashboard to turn on question review.${back}</div>`;
  else if (!queue?.items) $('stage').innerHTML = `<div class="quiet">Couldn't load your review list. Reload this page to try again.${back}</div>`;
  else if (!queue.items.length) $('stage').innerHTML = `<div class="quiet">Nothing to review right now. Questions you miss in a lesson quiz wait here until you get them right.${back}</div>`;
  else beginQuiz(queue.items.map(i => ({ lesson_id: i.lesson_id, slide: i.slide, question: i.question, answer: i.answer,
    context: `${i.class_code} · ${i.lesson_title}`, missedBefore: true })), { review: true, canSave: true });
}

function beginQuiz(items, options) {
  renderToken++;                                      // a diagram still drawing must not write into the quiz
  clearTimeout(advanceTimer);
  setPlaying(false);
  quiz = { items, pos: 0, revealed: false, typed: '', results: [], saves: Promise.resolve(), ...options };
  $('player').classList.add('quizzing');
  renderQuiz();
}

// Each result carries its own save outcome: null while it is in flight, then true or false.
function saveMessage() {
  if (!quiz.canSave) return "Results can't be saved until the dashboard is restarted.";
  const failed = quiz.results.filter(r => r.saved === false).length;
  if (!failed) return '';
  return failed === 1 ? "One answer couldn't be saved." : `${failed} answers couldn't be saved.`;
}
const noteHtml = () => `<p class="quiz-note" id="save-note"${saveMessage() ? '' : ' hidden'}>${esc(saveMessage())}</p>`;

// The summary promises the review list only once every missed answer has really been saved.
function reviewLine() {
  const missed = quiz.results.filter(r => r.result === 'missed');
  if (!missed.length) return quiz.review ? 'Nothing left to review.' : 'Every question answered right.';
  const head = `${missed.length} to come back to.`;
  if (!quiz.canSave) return head;
  if (missed.some(r => r.saved === false)) return `${head} Some of these couldn't be saved, so your review list may be out of date.`;
  return missed.every(r => r.saved === true) ? `${head} They stay in your review list until you get them right.` : head;
}

// Runs when a save settles. The summary can be on screen while its last save is still in flight.
function refreshSaveNotes() {
  const message = saveMessage(), note = $('save-note'), line = $('review-line');
  if (note) { note.textContent = message; note.hidden = !message; }
  if (line) line.textContent = reviewLine();
}

function questionHtml() {
  const item = quiz.items[quiz.pos], count = quiz.items.length;
  return `<div class="quiz"><div class="quiz-card">
    <div class="quiz-top">
      <div class="kind">Question ${quiz.pos + 1} of ${count}</div>
      <button class="quiz-leave" id="quiz-leave" title="Stop (Esc)">${quiz.review ? 'Stop reviewing' : 'Stop quiz'}</button>
    </div>
    <div class="quiz-bar" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${count}" aria-valuenow="${quiz.pos}"><span style="width:${quiz.pos / count * 100}%"></span></div>
    ${item.context ? `<div class="quiz-ctx">${esc(item.context)}</div>` : ''}
    <div class="question">${esc(item.question)}</div>
    ${item.missedBefore ? '<span class="chip warn">Missed last time</span>' : ''}
    <div id="ask">
      <label for="typed">Your answer (optional)</label>
      <textarea id="typed" rows="3" maxlength="${MAX_TYPED}" placeholder="Type it out, or just think it through"></textarea>
      <div class="quiz-actions"><button class="btn primary" id="reveal-q">Reveal answer<kbd aria-hidden="true">Enter</kbd></button></div>
    </div>
    <div id="revealed" hidden>
      <div class="yours" id="yours" hidden><b>Your answer</b><span id="yours-text"></span></div>
      <div class="answer" id="real-answer" tabindex="-1">${esc(item.answer)}</div>
      <div class="quiz-actions">
        <button class="btn primary" id="got">Got it<kbd aria-hidden="true">G</kbd></button>
        <button class="btn" id="missed">Missed it<kbd aria-hidden="true">M</kbd></button>
      </div>
    </div>
    <p class="hint" id="hint">Enter reveals the answer · Shift+Enter starts a new line</p>
    ${noteHtml()}
  </div></div>`;
}

function summaryHtml() {
  const missed = quiz.results.filter(r => r.result === 'missed'), got = quiz.results.length - missed.length;
  const leave = `<button class="btn" id="quiz-back">${quiz.review ? 'Back to lessons' : 'Back to the lesson'}</button>`;
  return `<div class="quiz"><div class="quiz-card">
    <div class="kind">${quiz.review ? 'Review' : 'Quiz'} finished</div>
    <div class="score">${got} of ${quiz.results.length} got it</div>
    <p class="quiz-ctx" id="review-line">${esc(reviewLine())}</p>
    ${missed.length ? `<ul class="missed-list">${missed.map(r => `<li>
      ${r.item.context ? `<div class="quiz-ctx">${esc(r.item.context)}</div>` : ''}
      <div class="question">${esc(r.item.question)}</div><div class="answer">${esc(r.item.answer)}</div></li>`).join('')}</ul>` : ''}
    <div class="quiz-actions">
      ${missed.length ? '<button class="btn primary" id="retry">Retry the missed ones</button>' : ''}
      ${leave}
    </div>
    ${noteHtml()}
  </div></div>`;
}

function renderQuiz() {
  const asking = quiz.pos < quiz.items.length;
  $('stage').innerHTML = asking ? questionHtml() : summaryHtml();
  if (asking) {
    $('quiz-leave').onclick = leaveQuiz;
    $('reveal-q').onclick = revealAnswer;
    $('got').onclick = () => grade('got');
    $('missed').onclick = () => grade('missed');
    if (matchMedia('(pointer:fine)').matches) $('typed').focus();    // on a phone this would only raise the keyboard
    return;
  }
  const missed = quiz.results.filter(r => r.result === 'missed').map(r => ({ ...r.item, missedBefore: true }));
  // The retry queues behind this run's saves, so its first answer cannot overtake the last one still in flight.
  if (missed.length) $('retry').onclick = () => beginQuiz(missed, { review: quiz.review, canSave: quiz.canSave, saves: quiz.saves });
  $('quiz-back').onclick = leaveQuiz;
  ($('retry') || $('quiz-back')).focus();
}

function revealAnswer() {
  if (quiz.revealed) return;
  quiz.revealed = true;
  quiz.typed = $('typed').value.trim();
  $('ask').hidden = true;
  $('revealed').hidden = false;
  if (quiz.typed) { $('yours').hidden = false; $('yours-text').textContent = quiz.typed; }   // text, never markup
  $('hint').textContent = 'G or 1: got it · M or 2: missed it';
  $('real-answer').focus();            // off the answer box, so the grading keys work and a screen reader reads it
}

function grade(result) {
  if (!quiz.revealed) return;          // grading a question you haven't seen the answer to means nothing
  const item = quiz.items[quiz.pos];
  const entry = { item, result, saved: null };
  quiz.results.push(entry);
  saveResult(entry, quiz.typed);
  quiz.pos++; quiz.revealed = false; quiz.typed = '';
  renderQuiz();
}

// Saves go one after another (a retried question is answered twice in a row), and never hold up the
// next question. A quiz that was left meanwhile still finishes its saves.
function saveResult(entry, typed) {
  if (!quiz.canSave) return;
  const run = quiz;
  const { item, result } = entry;
  run.saves = run.saves.then(async () => {
    try {
      const response = await post('/api/quiz/answer', { lesson_id: item.lesson_id, slide: item.slide, result, typed });
      entry.saved = response.ok;
    } catch {
      entry.saved = false;
    }
    if (quiz === run) refreshSaveNotes();
  });
}

async function leaveQuiz() {
  const run = quiz;
  if (run.review) { await run.saves; location.href = '/lessons'; return; }   // the last mark must land before the page goes
  quiz = null;
  $('player').classList.remove('quizzing');
  go(index);                           // back to the cover, or the slide the quiz was started from (paused)
  await run.saves;
  loadQuizState();                     // the cover's counts now include what was just marked
}

function quizKey(e) {
  const typing = e.target.closest('input, textarea, select');
  if (e.key === 'Escape') {
    // Escape in the answer box only leaves the box; a second press (or any press elsewhere) leaves the quiz
    e.preventDefault();
    if (typing) e.target.blur(); else leaveQuiz();
    return;
  }
  if (e.key === 'Enter') {
    // Enter on a focused button already presses it; Shift+Enter is a new line in the answer box
    if (e.target.closest('button, a') || e.shiftKey || e.isComposing) return;
    if (quiz.pos < quiz.items.length && !quiz.revealed) { e.preventDefault(); revealAnswer(); }
    return;
  }
  if (typing || !quiz.revealed || quiz.pos >= quiz.items.length) return;
  const key = e.key.toLowerCase();
  if (key === 'g' || key === '1') { e.preventDefault(); grade('got'); }
  else if (key === 'm' || key === '2') { e.preventDefault(); grade('missed'); }
}

(async () => {
  // A speed saved from the old list (0.85, 1.15, 1.3) isn't an option any more: use the nearest one.
  const saved = Number(recall('lessonSpeed')) || 1;
  const speeds = [...$('speed').options].map(o => Number(o.value));
  $('speed').value = String(speeds.reduce((a, b) => Math.abs(b - saved) < Math.abs(a - saved) ? b : a));
  audio.playbackRate = Number($('speed').value);
  if (recall('lessonAuto') === 'false') $('auto').setAttribute('aria-pressed', 'false');
  if (recall('lessonCaptions') === 'true') { $('cc').setAttribute('aria-pressed', 'true'); $('captions').hidden = false; }
  if (reviewMode) { await startReview(); return; }
  try {
    const response = await fetch('/api/lessons/lesson?id=' + encodeURIComponent(lessonId || ''));
    if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || 'Lesson not found');
    lesson = await response.json();
    document.title = lesson.title + ' · Lessons';
    $('lesson-name').textContent = `${lesson.class_code} · ${lesson.title}`;
    if (!slides().some(s => s.audio)) $('play').title = 'No narration - slides advance on a timer';
    $('quiz-btn').hidden = !checkItems().length;
    go(0);
    loadQuizState();                  // after the cover is up: the quiz buttons fill in when this arrives
  } catch (error) {
    $('stage').innerHTML = `<div class="error">${esc(error.message)}. <a href="/lessons">Back to lessons</a></div>`;
    $('lesson-name').textContent = 'Lesson unavailable';
  }
})();
</script>
</body>
</html>
