<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Notes</title>
<link rel="stylesheet" href="/style.css">
<script src="/stop.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Lecture Notes</div>
  <nav class="tabs" aria-label="Lecture tools">
    <a href="/" class="active" aria-current="page">Notes</a>
    <a href="/corrections">Corrections</a>
    <a href="/lessons">Lessons</a>
    <a href="/diagnostics">Diagnostics</a>
  </nav>
  <div class="search-wrap">
    <select id="search-mode" aria-label="Search mode"><option value="keyword">Keyword search</option><option value="semantic">Meaning search</option></select>
    <input id="search" aria-label="Search notes and transcripts" class="search" type="search" autocomplete="off"
           placeholder="Search all notes and transcripts…  (/ to focus)">
  </div>
  <span class="rec-pill" id="rec-pill" hidden><span class="live-dot" aria-hidden="true"></span>Recording now</span>
</header>

<main id="main" class="notes-view">
  <div class="empty">Loading…</div>
</main>

<script>
const state = { classes: [], sessions: null, activeClass: null, kind: 'notes', view: 'dashboard', query: '' };
const main = document.getElementById('main');
const searchBox = document.getElementById('search');

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = ts => new Date(ts * 1000).toLocaleDateString(undefined, { month:'short', day:'numeric' });
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

let viewVersion = 0;
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) { const error = await r.json().catch(()=>({})); throw new Error(error.error || `Request failed (${r.status})`); }
  return r.json();
}
function player(file, seconds = null) {
  if (!file) return '';
  const start = seconds == null ? '' : `#t=${Math.max(0, seconds).toFixed(2)}`;
  return `<div style="margin-top:12px"><div class="page-sub">${seconds == null ? 'Recording' : 'Play this moment'}
    </div><audio controls preload="none" aria-label="Lecture recording"
    src="/api/audio?file=${encodeURIComponent(file)}${start}" style="width:100%;max-width:600px"></audio></div>`;
}
window.addEventListener('unhandledrejection', event => {
  main.innerHTML = `<div class="empty">${esc(event.reason?.message || 'Could not load this view.')}<br>Refresh to retry.</div>`;
});

// Renders a search snippet: escapes it, applies the notes' inline markdown, and marks the
// matched terms. All three passes run against sentinel characters rather than real HTML,
// then tags are substituted in at the very end - otherwise the highlight regex would
// happily match inside the markup it just produced (searching "mark" or "strong" would
// corrupt the output).
const S = { b0:'\u0001', b1:'\u0002', i0:'\u0003', i1:'\u0004', m0:'\u0005', m1:'\u0006' };

function renderSnippet(text, query) {
  // Drop the source line's list marker - the snippet is shown in its own card, so a
  // stray leading "- " is just noise from the markdown it came from.
  let out = esc(text.replace(/^\s*[-*]\s+/, ''))
    .replace(/\*\*(.+?)\*\*/g, `${S.b0}$1${S.b1}`)
    .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, `${S.i0}$1${S.i1}`);

  for (const t of query.toLowerCase().split(/\s+/).filter(Boolean)) {
    // Escape regex metacharacters so a search for "C++" or "p < .05" can't break the pattern.
    const safe = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(`(${safe})`, 'gi'), `${S.m0}$1${S.m1}`);
  }

  return out
    .replaceAll(S.b0, '<strong>').replaceAll(S.b1, '</strong>')
    .replaceAll(S.i0, '<em>').replaceAll(S.i1, '</em>')
    .replaceAll(S.m0, '<mark>').replaceAll(S.m1, '</mark>');
}

// ---------- dashboard ----------
// The landing view: every class with its words and the audio recorded for it, the newest class's lectures, and
// what Jev flagged in its recordings. Clicking a class or a lecture opens its notes.

async function openDashboard() {
  const version = ++viewVersion;
  state.view = 'dashboard'; state.activeClass = null; state.query = '';
  searchBox.value = '';

  const classes = state.classes;
  const totalWords = classes.reduce((a, c) => a + c.words, 0);
  const totalLectures = classes.reduce((a, c) => a + c.lectures, 0);
  const largest = classes.reduce((a, c) => (!a || c.words > a.words ? c : a), null);
  const newest = classes.reduce((a, c) => (!a || c.updated > a.updated ? c : a), null);
  const byWords = [...classes].sort((a, b) => b.words - a.words);

  const rows = byWords.map(c => {
    return `
      <tr>
        <th scope="row">
          <button type="button" class="row-link" data-class="${esc(c.code)}">${esc(c.code)}</button>
          <div class="row-title">${esc(c.title)}</div>
        </th>
        <td class="num">${c.lectures}</td>
        <td class="num">${c.words.toLocaleString()}</td>
        <td class="recorded" data-recorded="${esc(c.code)}"><span class="muted-cell">Loading…</span></td>
        <td class="muted-cell">${fmtDate(c.updated)}</td>
      </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Dashboard</div>
        <h1 class="page-title">Lecture notes</h1>
        <p class="page-sub">${plural(classes.length, 'class')}, ${totalWords.toLocaleString()} words. ${plural(totalLectures, 'lecture')} in all.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn" id="open-recordings">Recordings</button>
      </div>
    </div>

    <section class="stat-grid" aria-label="Summary">
      <div class="stat">
        <div class="stat-label">Classes</div>
        <div class="stat-value">${classes.length}</div>
        <div class="stat-sub">${esc(classes.map(c => c.code).join(', ')) || 'None yet'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Words in notes</div>
        <div class="stat-value">${totalWords.toLocaleString()}</div>
        <div class="stat-sub">${largest ? `Largest: ${esc(largest.code)}, ${largest.words.toLocaleString()}` : 'No notes yet'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Lectures</div>
        <div class="stat-value">${totalLectures}</div>
        <div class="stat-sub">${newest ? `Newest class: ${esc(newest.code)}, ${fmtDate(newest.updated)}` : ''}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Recordings</div>
        <div class="stat-value" id="stat-recordings">…</div>
        <div class="stat-sub" id="stat-recordings-sub">Raw audio and transcripts</div>
      </div>
    </section>

    <div class="dash-grid">
      <section class="panel" aria-labelledby="classes-title">
        <div class="panel-head">
          <h2 class="label-caps" id="classes-title">Classes</h2>
          <span class="panel-meta">Sorted by words</span>
        </div>
        <div class="table-wrap">
          <table class="class-table">
            <thead>
              <tr>
                <th scope="col">Class</th>
                <th scope="col" class="num">Lectures</th>
                <th scope="col" class="num">Words</th>
                <th scope="col">Audio recorded</th>
                <th scope="col">Updated</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </section>

      <div class="dash-side">
        <section class="panel" aria-labelledby="lectures-title">
          <div class="panel-head">
            <h2 class="label-caps" id="lectures-title">Lectures</h2>
            <span class="panel-meta" id="lectures-meta"></span>
          </div>
          <ol class="lecture-list" id="lecture-list"><li class="panel-meta">Loading…</li></ol>
        </section>

        <section class="panel" aria-labelledby="highlights-title">
          <div class="panel-head">
            <h2 class="label-caps" id="highlights-title">Flagged in the recording</h2>
          </div>
          <div id="recording-panel"><p class="panel-note">Loading…</p></div>
        </section>
      </div>
    </div>

    <section class="panel latest-notes" id="latest-notes" aria-labelledby="latest-title" hidden>
      <div class="panel-head">
        <h2 class="label-caps" id="latest-title"></h2>
        <button type="button" class="btn btn-sm" id="open-latest">Open notes</button>
      </div>
      <div class="latest-body" id="latest-body"></div>
    </section>`;

  document.getElementById('open-recordings').onclick = openSessions;
  main.querySelectorAll('.row-link').forEach(b => b.onclick = () => openClass(b.dataset.class));

  if (newest) loadFocus(newest.code, version);
  else {
    document.getElementById('lecture-list').innerHTML = '<li class="panel-meta">No lectures yet.</li>';
    document.getElementById('recording-panel').innerHTML = '<p class="panel-note">Record a lecture to see what Jev flags.</p>';
  }

  try {
    state.sessions = state.sessions || await api('/api/sessions');
  } catch (e) {
    state.sessions = null;
  }
  if (version !== viewVersion) return;
  const sessions = state.sessions || [];
  const total = sessions.reduce((a, s) => a + s.mb, 0);
  document.getElementById('stat-recordings').textContent = state.sessions ? sessions.length : '—';
  document.getElementById('stat-recordings-sub').textContent = state.sessions
    ? `${(total / 1000).toFixed(1)} GB of audio backups` : 'Could not load recordings';
  fillRecorded();
}

// Audio recorded per class, from the same session list as the Recordings count.
function fillRecorded() {
  for (const cell of main.querySelectorAll('[data-recorded]')) {
    const sessions = state.sessions;
    if (!sessions) { cell.innerHTML = '<span class="muted-cell">Unavailable</span>'; continue; }
    const mine = sessions.filter(s => s.class_code === cell.dataset.recorded);
    if (!mine.length) { cell.innerHTML = '<span class="muted-cell">Not recorded</span>'; continue; }
    const minutes = mine.reduce((a, s) => a + s.minutes, 0);
    const amount = minutes >= 60 ? `${(minutes / 60).toFixed(1)} h` : `${Math.round(minutes)} min`;
    cell.innerHTML = `<div class="recorded-amount">${amount}</div><div class="row-title">${plural(mine.length, 'session')}</div>`;
  }
}

// The lectures and flagged items for one class, shown on the dashboard.
async function loadFocus(code, version) {
  const lectureList = document.getElementById('lecture-list');
  const recPanel = document.getElementById('recording-panel');
  const meta = document.getElementById('lectures-meta');
  meta.textContent = code;

  let doc, hl = null;
  try {
    [doc, hl] = await Promise.all([
      api(`/api/document?class=${encodeURIComponent(code)}&kind=notes`),
      api(`/api/highlights?class=${encodeURIComponent(code)}`).catch(() => null),
    ]);
  } catch (e) {
    if (version !== viewVersion) return;
    lectureList.innerHTML = `<li class="panel-note">${esc(e.message)}</li>`;
    return;
  }
  if (version !== viewVersion) return;

  const toc = doc.toc || [];
  renderLatestNotes(code, doc, toc);
  const boxes = new Map((hl?.lectures || []).map(box => [box.anchor, box]));
  const jevReady = !!(hl && hl.jev && hl.jev.ready);
  const flagged = box => box ? box.exam.length + box.announcement.length + box.not_tested.length : 0;

  meta.textContent = `${code} · ${plural(toc.length, 'lecture')}`;
  lectureList.innerHTML = toc.length ? toc.map(t => {
    const box = boxes.get(t.anchor);
    const note = !jevReady ? 'Notes ready'
      : !box ? 'No recording'
      : flagged(box) ? plural(flagged(box), 'flagged item') : 'Nothing flagged';
    return `<li><button type="button" class="lecture-row" data-class="${esc(code)}" data-anchor="${esc(t.anchor)}">
        <span class="lecture-date">${esc(t.date)}</span><span class="lecture-note">${esc(note)}</span></button></li>`;
  }).join('') : '<li class="panel-note">No lectures in these notes yet.</li>';
  lectureList.querySelectorAll('.lecture-row').forEach(b =>
    b.onclick = () => openClass(b.dataset.class, 'notes', b.dataset.anchor));

  if (!jevReady) {
    recPanel.innerHTML = '<p class="panel-note">Highlights come from Jev, which is off or has no key. Lecture notes are unaffected.</p>';
    return;
  }
  // The newest lecture that has anything flagged (or is still being read).
  const latest = [...toc].reverse().find(t => {
    const box = boxes.get(t.anchor);
    return box && (flagged(box) || box.pending.length);
  });
  if (!latest) {
    recPanel.innerHTML = '<p class="panel-note">Nothing flagged in this class\'s recordings yet.</p>';
    return;
  }
  const box = boxes.get(latest.anchor);
  recPanel.innerHTML = `<p class="panel-note" style="margin-bottom:4px">${esc(latest.date)}</p>${highlightBox(box)}`;
  wireHighlights(recPanel);
}

// The opening of the newest lecture that has notes, so the dashboard shows what was written, not just a date.
function renderLatestNotes(code, doc, toc) {
  const panel = document.getElementById('latest-notes');
  if (!toc.length || !doc.html) { panel.hidden = true; return; }
  const template = document.createElement('template');
  template.innerHTML = doc.html;
  for (const item of [...toc].reverse()) {
    const heading = template.content.getElementById(item.anchor);
    const blocks = [];
    for (let node = heading?.nextElementSibling; node && node.tagName !== 'H2' && blocks.length < 4; node = node.nextElementSibling) {
      blocks.push(node.cloneNode(true));
    }
    if (!blocks.length) continue;
    document.getElementById('latest-body').replaceChildren(...blocks);
    document.getElementById('latest-title').textContent = `Latest notes · ${code} · ${item.date}`;
    document.getElementById('open-latest').onclick = () => openClass(code, 'notes', item.anchor);
    panel.hidden = false;
    return;
  }
  panel.hidden = true;
}

// ---------- class document ----------

async function openClass(code, kind = 'notes', anchor = null) {
  const version = ++viewVersion;
  state.activeClass = code; state.kind = kind; state.view = 'class';
  searchBox.value = ''; state.query = '';
  main.innerHTML = '<div class="empty">Loading…</div>';

  const cls = state.classes.find(c => c.code === code) || {};
  const doc = await api(`/api/document?class=${encodeURIComponent(code)}&kind=${kind}`);

  if (version !== viewVersion) return;
  const tabs = `
    <div class="seg" id="kind-tabs">
      <button data-kind="notes" class="${kind==='notes'?'active':''}">Notes</button>
      <button data-kind="study_guide" class="${kind==='study_guide'?'active':''}"
        ${cls.has_study_guide ? '' : 'disabled'}>Study guide</button>
      <button data-kind="flashcards" class="${kind==='flashcards'?'active':''}"
        ${cls.has_flashcards ? '' : 'disabled'}>Flashcards</button>
    </div>`;

  let body;
  if (doc.error) {
    body = `<div class="empty">Nothing here yet.<br><span style="font-size:13px">
      ${kind === 'study_guide' ? 'Generate one with <code class="mono">--study-guide</code>.'
        : kind === 'flashcards' ? 'Generate some with <code class="mono">--flashcards</code>.' : ''}
      </span></div>`;
  } else if (kind === 'flashcards') {
    body = `<div class="page-sub">${doc.cards.length} cards · click to reveal</div>` +
      doc.cards.map(c => `<div class="flashcard" role="button" tabindex="0" aria-expanded="false">
        <div class="front">${esc(c.front)}</div>
        <div class="back">${esc(c.back)}</div>
        <div class="reveal-hint">click to reveal</div></div>`).join('');
  } else {
    const toc = (doc.toc || []).length > 1
      ? `<div class="toc"><div class="section-label">Lectures</div>
         ${doc.toc.map(t => `<a href="#${t.anchor}">${esc(t.date)}</a>`).join('')}</div>`
      : '<div></div>';
    body = `<div class="with-toc"><div class="doc">${doc.html}</div>${toc}</div>`;
  }

  main.innerHTML = `
    <button type="button" class="back-link" id="back-link">← All classes</button>
    <h1 class="page-title">${esc(cls.title || code)}</h1>
    <div class="page-sub">${esc(code)} · ${plural(cls.lectures || 0, 'lecture')}${
      doc.words ? ` · ${doc.words.toLocaleString()} words` : ''}</div>
    <div style="margin-bottom:22px">${tabs}</div>
    ${body}`;

  document.getElementById('back-link').onclick = openDashboard;
  main.querySelectorAll('#kind-tabs button').forEach(b =>
    b.onclick = () => !b.disabled && openClass(code, b.dataset.kind));
  if (kind === 'notes' && !doc.error) loadHighlights(code, version);
  main.querySelectorAll('.flashcard').forEach(card => {
    card.onclick = () => card.setAttribute('aria-expanded', String(card.classList.toggle('revealed')));
    card.onkeydown = event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); card.click(); }
    };
  });
  if (anchor) document.getElementById(anchor)?.scrollIntoView({ block: 'start' });
}

// ---------- lecture highlights (Jev) ----------
// Exam hints, "not on the exam" remarks and announcements Jev found in each recording, shown
// under that lecture's date heading. The notes file itself is never changed. Anything that
// can't be loaded (an older dashboard server, Jev off or without a key) just leaves no box.

const HIGHLIGHT_GROUPS = [
  ['exam', 'On the exam'],
  ['announcement', 'Deadlines & announcements'],
  ['not_tested', 'Not needed for the exam'],
];

function highlightBox(box) {
  const groups = HIGHLIGHT_GROUPS.filter(([kind]) => box[kind].length).map(([kind, title]) => `
    <div class="hl-group">
      <div class="hl-label">${esc(title)} <span class="hl-count">${box[kind].length}</span></div>
      ${box[kind].map(item => {
        const when = (item.part ? `part ${item.part} · ` : '') + (item.clock || '');
        return `
        <div class="hl-item">
          ${item.audio_file && item.start != null
            ? `<button class="hl-play" data-file="${esc(item.audio_file)}" data-start="${item.start}"
                 aria-label="Play the recording from ${esc(when)}">▶ ${esc(when)}</button>`
            : `<span class="hl-time">${esc(when)}</span>`}
          <div class="hl-text" tabindex="0" title="Click to show all">${esc(item.text)}</div>
        </div>`;
      }).join('')}
    </div>`).join('');
  const waiting = box.pending.includes('recording') ? 'This lecture is still recording; it will be read when it ends.'
    : box.pending.length ? 'Jev is still reading this lecture…' : '';
  if (!groups && !waiting) return '';
  return `<section class="highlights" aria-label="Highlights from this lecture's recording">
    <div class="hl-head"><span class="hl-title">From the recording</span>
      <span class="hl-note">found by Jev from the transcript, so it can miss or mislabel things</span></div>
    ${groups}${waiting ? `<p class="hl-waiting">${esc(waiting)}</p>` : ''}
  </section>`;
}

// Makes the play buttons and the click-to-expand passages inside `root` work.
function wireHighlights(root) {
  root.querySelectorAll('.hl-play').forEach(button => button.onclick = () => {
    const item = button.closest('.hl-item');
    const open = item.querySelector('audio');
    if (open) { open.remove(); return; }
    root.querySelectorAll('.hl-item audio').forEach(a => a.remove());
    item.insertAdjacentHTML('beforeend', `<audio controls autoplay preload="auto" aria-label="Lecture recording"
      src="/api/audio?file=${encodeURIComponent(button.dataset.file)}#t=${Math.max(0, Number(button.dataset.start)).toFixed(2)}"></audio>`);
  });
  root.querySelectorAll('.hl-text').forEach(text => {
    const toggle = () => text.classList.toggle('open');
    text.onclick = toggle;
    text.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } };
  });
}

async function loadHighlights(code, version) {
  let data;
  try { data = await api(`/api/highlights?class=${encodeURIComponent(code)}`); } catch { return; }
  if (version !== viewVersion || !data || !data.jev || !data.jev.ready) return;
  for (const box of data.lectures || []) {
    const heading = document.getElementById(box.anchor);
    const html = highlightBox(box);
    if (heading && html) heading.insertAdjacentHTML('afterend', html);
  }
  wireHighlights(main);
  // Still reading a lecture: look again shortly, as long as this class is still on screen.
  if ((data.lectures || []).some(box => box.pending.some(p => p !== 'recording'))) refreshHighlightsLater(code, version);
}

function refreshHighlightsLater(code, version) {
  setTimeout(() => {
    if (version !== viewVersion || state.view !== 'class' || state.kind !== 'notes') return;
    // Don't pull the rug out from under a clip that's playing or an expanded passage.
    if (main.querySelector('.hl-item audio, .hl-text.open')) return refreshHighlightsLater(code, version);
    main.querySelectorAll('.highlights').forEach(box => box.remove());
    loadHighlights(code, version);
  }, 15000);
}

// ---------- recordings ----------

async function openSessions() {
  const version = ++viewVersion;
  state.view = 'sessions'; state.activeClass = null;
  searchBox.value = ''; state.query = '';
  main.innerHTML = '<div class="empty">Loading…</div>';

  const sessions = state.sessions = await api('/api/sessions');
  if (version !== viewVersion) return;
  const total = sessions.reduce((a, s) => a + s.mb, 0);
  main.innerHTML = `
    <button type="button" class="back-link" id="back-link">← All classes</button>
    <h1 class="page-title">Recordings</h1>
    <div class="page-sub">${plural(sessions.length, 'session')} · ${(total/1000).toFixed(1)} GB of audio backups</div>
    ${sessions.length ? sessions.map(s => `
      <div class="hit">
        <div class="hit-meta">
          <span class="badge notes">${esc(s.class_code)}</span>
          <span>${esc(s.date)} at ${esc(s.time)}</span>
          <span>·</span><span>${s.minutes} min</span>
          <span>·</span><span>${s.mb} MB</span>
          ${s.has_transcript ? `<span>·</span><span>${s.transcript_lines} transcript lines</span>` : ''}
        </div>
        <div class="hit-text mono" style="font-size:12.5px;color:var(--text-dim)">${esc(s.wav)}</div>
        ${player(s.wav)}
        <a class="btn" href="/corrections?session=${encodeURIComponent(s.wav.replace(/\.wav$/,''))}">Correct this lecture</a>
      </div>`).join('') : '<div class="empty">No recordings yet.</div>'}`;
  document.getElementById('back-link').onclick = openDashboard;
}

// ---------- search ----------

let searchTimer = null;
document.getElementById("search-mode").onchange = runSearch;
searchBox.addEventListener('input', () => {
  clearTimeout(searchTimer);
  if (document.getElementById('search-mode').value === 'semantic') return;
  searchTimer = setTimeout(runSearch, document.getElementById("search-mode").value === "semantic" ? 900 : 180);  // debounce: search hits disk on every keystroke
});
searchBox.addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });

async function runSearch() {
  const version = ++viewVersion;
  const q = searchBox.value.trim();
  state.query = q;
  if (!q) {
    if (state.activeClass) openClass(state.activeClass, state.kind);
    else if (state.view !== 'dashboard') openDashboard();
    return;
  }
  state.view = 'search';
  main.innerHTML = '<p class="muted">Searching… The first meaning search also indexes new passages.</p>';
  let hits, ranking = null;
  const mode = document.getElementById('search-mode').value;
  try { hits = await api(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}${mode === 'semantic' ? '&rank=1' : ''}`); }
  catch (e) { if(version === viewVersion) main.innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  // Meaning search answers {results, ranked_by, note} when it can re-rank with Jev; an older
  // dashboard server answers a bare list.
  if (!Array.isArray(hits)) { ranking = hits; hits = hits.results || []; }

  if (version !== viewVersion || q !== searchBox.value.trim()) return;
  const notes = hits.filter(h => h.source === 'notes');
  const transcripts = hits.filter(h => h.source === 'transcript');
  const group = (title, rows) => !rows.length ? '' : `
    <div class="section-label" style="margin:24px 0 10px">${title} (${rows.length})</div>
    ${rows.map(h => `
      <div class="hit">
        <div class="hit-meta">
          <span class="badge ${h.source}">${esc(h.class_code)}</span>
          <span>${esc(h.location)}</span>
          ${h.section ? `<span>·</span><span>${esc(h.section)}</span>` : ''}
          ${h.timestamp ? `<span>·</span><span class="mono">${esc(h.timestamp)}</span>` : ''}
        </div>
        <div class="hit-text">${renderSnippet(h.text, q)}</div>
        ${player(h.audio_file, h.audio_seconds)}
      </div>`).join('')}`;

  main.innerHTML = `
    <h1 class="page-title">Search</h1>
    <div class="page-sub">${hits.length} result${hits.length === 1 ? '' : 's'} for “${esc(q)}”${
      ranking?.ranked_by === 'jev' ? ' · best answers first, ranked by Jev'
      : ranking?.note ? ` · closest in meaning first (Jev ranking unavailable: ${esc(ranking.note)})` : ''}</div>
    ${hits.length ? group('In your notes', notes) + group('In raw transcripts', transcripts)
                  : '<div class="empty">No matches.</div>'}`;
}

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchBox) { e.preventDefault(); searchBox.focus(); }
  if (e.key === 'Escape' && document.activeElement === searchBox) { searchBox.blur(); }
});

// ---------- boot ----------

// "Recording now" in the top bar. Best effort: a slow or failed status check just hides it.
(async () => {
  try {
    const status = await api('/api/status');
    document.getElementById('rec-pill').hidden = !(status.recorder && status.recorder.running);
  } catch (e) { /* keep it hidden */ }
})();

(async () => {
  state.classes = await api('/api/classes');
  if (state.classes.length) openDashboard();
  else main.innerHTML = '<div class="empty">No notes yet — record a lecture first.</div>';
})();
</script>
</body>
</html>
